<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Directory · Art Openings Sydney</title>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <h1 class="site-title">Gallery<span class="accent">Directory</span></h1>
        <p class="site-tagline">Every art gallery in Sydney</p>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn-back">&larr; Exhibitions</a>
      </div>
    </div>
  </header>

  <section class="filters-bar">
    <div class="filters-inner">
      <div class="filter-group">
        <input type="text" id="search" class="filter-input" placeholder="Search galleries...">
      </div>
      <div class="filter-group">
        <select id="filter-type" class="filter-select">
          <option value="">All types</option>
          <option value="commercial">Commercial</option>
          <option value="ari">Artist-run</option>
          <option value="museum">Museum / Institution</option>
          <option value="university">University</option>
          <option value="project_space">Project space</option>
        </select>
      </div>
      <div class="filter-group">
        <select id="filter-suburb" class="filter-select">
          <option value="">All suburbs</option>
        </select>
      </div>
      <div class="filter-group">
        <span id="gallery-count" class="gallery-count"></span>
      </div>
    </div>
  </section>

  <main class="content">
    <div id="gallery-list" class="gallery-grid"></div>
    <p id="no-results" class="no-results" hidden>No galleries match your filters.</p>
  </main>

  <footer class="site-footer">
    <p><a href="index.html">Exhibitions</a> &middot; <a href="https://artsydney.github.io/art-grants-dashboard/" target="_blank">Open Calls</a></p>
  </footer>

  <script src="galleries.js?v=2"></script>
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "fd171a49b3674abab750954be78efce2"}'></script>
</body>
</html>
