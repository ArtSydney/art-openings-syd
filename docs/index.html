<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Art Openings Sydney</title>
  <link rel="stylesheet" href="style.css?v=8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <h1 class="site-title">Art Openings<span class="accent">SYD</span></h1>
        <p class="site-tagline">Exhibitions &amp; openings across Sydney</p>
      </div>
      <div class="header-actions">
        <button id="btn-view-list" class="view-btn active" title="List view">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="2" width="16" height="3" rx="1" fill="currentColor"/><rect x="1" y="7.5" width="16" height="3" rx="1" fill="currentColor"/><rect x="1" y="13" width="16" height="3" rx="1" fill="currentColor"/></svg>
        </button>
        <button id="btn-view-cal" class="view-btn" title="Calendar view">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/><line x1="1" y1="7" x2="17" y2="7" stroke="currentColor" stroke-width="1.5"/><line x1="6" y1="3" x2="6" y2="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="12" y1="3" x2="12" y2="1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <a href="galleries.html" class="view-btn" title="Gallery directory">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="16" height="16" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="4" y="4" width="10" height="10" rx="1" stroke="currentColor" stroke-width="1.5"/></svg>
        </a>
      </div>
    </div>
  </header>

  <section class="filters-bar">
    <div class="filters-top">
      <input type="text" id="search" class="filter-input" placeholder="Search exhibitions...">
      <button id="btn-filter-toggle" class="btn-filter-toggle" aria-expanded="false" aria-controls="filters-panel">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 3h14M4 8h8M6 13h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span>Filters</span>
        <span id="filter-badge" class="filter-badge" hidden></span>
      </button>
    </div>
    <div id="filters-panel" class="filters-panel">
      <div class="filters-inner">
        <div class="filter-group filter-toggles">
          <label class="toggle-chip">
            <input type="checkbox" id="filter-on-now" checked>
            <span>On now</span>
          </label>
          <label class="toggle-chip">
            <input type="checkbox" id="filter-opening-week">
            <span>Opening this week</span>
          </label>
          <label class="toggle-chip">
            <input type="checkbox" id="filter-closed">
            <span>Show closed</span>
          </label>
        </div>
        <div class="filter-row">
          <select id="filter-suburb" class="filter-select">
            <option value="">All suburbs</option>
          </select>
          <select id="filter-venue" class="filter-select">
            <option value="">All galleries</option>
          </select>
        </div>
        <div class="filter-group">
          <button id="btn-to-cal" class="btn-calendar" title="View calendar">Calendar</button>
        </div>
      </div>
    </div>
  </section>

  <main class="content">
    <div id="view-list" class="view active">
      <div id="exhibition-list" class="exhibition-grid"></div>
      <p id="no-results" class="no-results" hidden>No exhibitions match your filters.</p>
    </div>
    <div id="view-cal" class="view">
      <div class="cal-header">
        <button id="cal-prev" class="cal-nav">&larr;</button>
        <h2 id="cal-title" class="cal-title"></h2>
        <button id="cal-next" class="cal-nav">&rarr;</button>
        <button id="btn-export-ics" class="btn-export-cal" title="Download all as ICS">Export ICS</button>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
      <p class="cal-rotate-hint">Rotate your phone for the full calendar view</p>
      <div id="cal-agenda" class="cal-agenda"></div>
    </div>
  </main>

  <div id="event-popup" class="event-popup" hidden>
    <div class="popup-backdrop"></div>
    <div class="popup-content">
      <button class="popup-close">&times;</button>
      <h3 id="popup-title"></h3>
      <div id="popup-meta" class="popup-meta"></div>
      <div id="popup-dates" class="popup-dates"></div>
      <p id="popup-desc" class="popup-desc"></p>
      <div id="popup-actions" class="popup-actions"></div>
    </div>
  </div>

  <footer class="site-footer">
    <p><a href="https://artsydney.github.io/art-grants-dashboard/" target="_blank">Open Calls</a></p>
  </footer>

  <script src="app.js?v=20"></script>
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "93b21e6a7af8466ebde45013e7cb409a"}'></script>
</body>
</html>
